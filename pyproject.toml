[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-harness"
version = "0.1.0"
description = "A terminal AI assistant that works with small local models - two tool protocols, one tool table, and an undo for everything it writes."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "minjun1177" }]
keywords = ["llm", "ollama", "cli", "agent", "mcp", "local-llm", "tool-calling"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]

# The floors are the versions the suite is actually run against and the
# ceilings stop the next breaking release arriving unannounced; the reasoning
# is in requirements.txt, which stays the single place they are written down.
dependencies = [
    "ollama>=0.6.2,<1.0",
    "prompt_toolkit>=3.0.53,<4.0",
    "duckduckgo_search>=8.1.1,<9.0",
    "requests>=2.34.2,<3.0",
    "beautifulsoup4>=4.15.0,<5.0",
    "psutil>=7.2.2,<8.0",
]

[project.optional-dependencies]
# Tree-sitter powers `get_code_skeleton` and `query_ast_node` only. Ten grammars
# is a lot of wheels to pull for two tools, and `config.py` already runs without
# them, so they are opt-in: pip install "simple-harness[ast]"
ast = [
    "tree-sitter>=0.26.0,<0.27",
    "tree-sitter-python>=0.25.0,<0.26",
    "tree-sitter-javascript>=0.25.0,<0.26",
    "tree-sitter-typescript>=0.23.2,<0.24",
    "tree-sitter-java>=0.23.5,<0.24",
    "tree-sitter-c>=0.24.2,<0.25",
    "tree-sitter-cpp>=0.23.4,<0.24",
    "tree-sitter-go>=0.25.0,<0.26",
    "tree-sitter-rust>=0.24.2,<0.25",
    "tree-sitter-c-sharp>=0.23.5,<0.24",
]

[project.urls]
Homepage = "https://github.com/minjun1177/chat"
Repository = "https://github.com/minjun1177/chat"
Issues = "https://github.com/minjun1177/chat/issues"

[project.scripts]
simple-harness = "app:cli"

# ---------------------------------------------------------------------------
# NOT READY TO PUBLISH - read this before `twine upload`
#
# The harness is a flat set of top-level modules, and they are installed as
# top-level modules. That is fine for `pip install -e .` here, and wrong on
# PyPI: it would put `config`, `tools`, `session` and `context` into the
# importable root of every environment that installed it, where they would
# shadow anybody else's module of the same name.
#
# Publishing needs the modules moved into a `simple_harness/` package first and
# every `import config` turned into a package-relative import. Until that is
# done this file is for local installs and for holding the name.
# ---------------------------------------------------------------------------
[tool.setuptools]
py-modules = [
    "app", "atomic", "config", "connect", "context", "deepthink", "git_ops",
    "llm_client", "mcp_client", "permissions", "providers", "renderer",
    "session", "shell_session", "skills", "sse", "subagent", "systemprompt",
    "toolspec", "tools", "tui", "websearch",
]

[tool.setuptools.package-data]
"*" = ["skills/**/*.md", "*.example"]
